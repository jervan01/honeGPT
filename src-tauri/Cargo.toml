[package]
name = "honegpt"
version = "0.1.0"
description = "honeGPT - lightweight OpenAI-compatible chat client"
edition = "2021"

[lib]
name = "honegpt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
