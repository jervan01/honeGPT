name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "目标架构（aarch64 = 绝大多数现代手机；all = 通用包，体积更大）"
        default: aarch64
        type: choice
        options: [aarch64, armv7, x86_64, all]
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Generate icons
        run: tauri icon app-icon.png

      - name: Init Android project
        run: tauri android init --ci

      - name: Dark window background / system bars
        run: |
          f=$(find src-tauri/gen/android -name themes.xml -path "*res/values/*" | head -1 || true)
          if [ -n "$f" ]; then
            python3 - "$f" <<'EOF'
          import sys, re
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          add = ('    <item name="android:windowBackground">#0f1115</item>\n'
                 '    <item name="android:statusBarColor">#0f1115</item>\n'
                 '    <item name="android:navigationBarColor">#0f1115</item>\n')
          if "windowBackground" not in s:
              s = re.sub(r"(</style>)", add + r"\1", s, count=1)
              open(p, "w", encoding="utf-8").write(s)
          print("patched", p)
          EOF
          fi

      - name: Build APK
        run: |
          case "${{ inputs.abi || 'aarch64' }}" in
            all) TARGETS="" ;;
            *)   TARGETS="--target ${{ inputs.abi || 'aarch64' }}" ;;
          esac
          tauri android build --apk --ci $TARGETS

      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/hone.keystore
          key: hone-keystore-v1

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/hone.keystore"; PASS="$KS_PASS"
          else
            PASS="honegpt123"
            [ -f "$HOME/hone.keystore" ] || keytool -genkeypair -keystore "$HOME/hone.keystore" \
              -alias hone -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=honeGPT"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(find src-tauri/gen/android -path "*outputs/apk*" -name "*.apk" | grep -i unsigned | head -1 || true)
          [ -n "$SRC" ] || SRC=$(find src-tauri/gen/android -path "*outputs/apk*" -name "*.apk" | head -1)
          echo "source apk: $SRC"
          "$BT/zipalign" -p -f 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks "$HOME/hone.keystore" --ks-key-alias hone \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out honeGPT.apk aligned.apk
          "$BT/apksigner" verify honeGPT.apk
          ls -lh honeGPT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: honeGPT-apk
          path: honeGPT.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: honeGPT.apk
